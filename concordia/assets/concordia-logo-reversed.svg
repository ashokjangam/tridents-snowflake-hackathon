<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">Concordia reversed logo</title>
  <desc id="desc">Transparent-background reversed Concordia logo for use on deep surfaces.</desc>
