  <g transform="translate(43 48)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M122 16V82L89 115" stroke="#8EB1FF" stroke-width="20"/>
    <path d="M18 198L73 166L90 149" stroke="#55D7CF" stroke-width="20"/>
    <path d="M226 198L171 166L154 149" stroke="#B0C8FF" stroke-width="20"/>
    <path d="M122 97L159 134L122 171L85 134Z" fill="none" stroke="#F4F8FC" stroke-width="8"/>
    <path d="M122 109L147 134L122 159L97 134Z" stroke="#55D7CF" stroke-width="4"/>
    <circle cx="122" cy="134" r="7" fill="#F4F8FC" stroke="none"/>
    <path d="M159 134H238" stroke="#F4F8FC" stroke-width="9"/>
    <circle cx="238" cy="134" r="8" fill="#F4F8FC"/>
  </g>
  <g transform="translate(340 102)">
